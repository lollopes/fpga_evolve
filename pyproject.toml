[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-boolean-network"
version = "0.1.0"
description = "Evolvable synchronous Boolean network — Python model for FPGA exploration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
viz = [
    "dash>=2.0",
    "dash-cytoscape>=0.3.0",
    "plotly>=5.0",
    "networkx>=3.0",
    "comm>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
